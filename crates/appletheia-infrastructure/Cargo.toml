[package]
name = "appletheia-infrastructure"
description = "The Infrastructure Layer for Event-Sourcing Architecture"
version = "0.17.0"
edition = "2024"
license = "MIT"
include = ["src/**", "migrations/**", "Cargo.toml", "README.md", "LICENSE"]
authors = ["pbandj082 <pbandj082@gmail.com>"]
repository = "https://github.com/Lethephobia/appletheia"
keywords = ["appletheia", "ddd", "event-sourcing", "cqrs"]

[features]
default = []
sha = ["dep:sha2", "dep:base64"]
jwt = ["dep:jsonwebtoken", "dep:sha2", "dep:base64", "dep:url"]
http = ["dep:reqwest", "dep:httpdate", "dep:url", "dep:base64"]
aes-gcm = ["dep:aes-gcm", "dep:getrandom"]
postgresql = ["dep:sqlx"]
google-cloud-pubsub = ["dep:google-cloud-pubsub", "dep:google-cloud-gax", "dep:base64"]
google-cloud-storage = ["dep:google-cloud-storage", "dep:google-cloud-auth", "dep:bytes", "dep:base64"]
full = ["http", "jwt", "sha", "aes-gcm", "postgresql", "google-cloud-pubsub", "google-cloud-storage"]

[dependencies]
appletheia-domain = { workspace = true }
appletheia-application = { workspace = true }
thiserror = { workspace = true }
sqlx = { version = "0.9.0", optional = true, features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
] }
uuid = { workspace = true, features = ["serde", "v7"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true }
google-cloud-pubsub = { version = "1.4.0", optional = true }
google-cloud-gax = { version = "1.14.0", optional = true }
google-cloud-auth = { version = "1.16.0", optional = true }
google-cloud-storage = { version = "1.18.0", optional = true }
jsonwebtoken = { version = "11.0.0", optional = true, features = ["aws_lc_rs"] }
reqwest = { version = "0.13.5", optional = true, default-features = false, features = ["rustls", "gzip"] }
httpdate = { version = "1.0.3", optional = true }
url = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
aes-gcm = { version = "0.11.1", optional = true, features = ["rand_core"] }
getrandom = { version = "0.4.3", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
