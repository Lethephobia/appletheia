[workspace]
resolver = "3"

members = [
    "crates/appletheia",
    "crates/appletheia-anchor",
    "crates/appletheia-domain",
    "crates/appletheia-application",
    "crates/appletheia-infrastructure",
    "crates/appletheia-macros",
]

[workspace.package]
edition = "2024"
license = "MIT"
readme = "README.md"
authors = ["pbandj082 <pbandj082@gmail.com>"]
repository = "https://github.com/Lethephobia/appletheia"
description = "The Application Interfaces for Event-Sourcing Architecture"
keywords = ["appletheia", "ddd", "event-sourcing", "cqrs"]

[workspace.dependencies]
appletheia-domain = { version = "0.5.0", path = "crates/appletheia-domain" }
appletheia-application = { version = "0.25.0", path = "crates/appletheia-application" }
appletheia-infrastructure = { version = "0.16.0", path = "crates/appletheia-infrastructure" }
appletheia-macros = { version = "0.3.0", path = "crates/appletheia-macros" }
appletheia-anchor = { version = "0.1.0", path = "crates/appletheia-anchor" }
anchor-lang = "1.0.2"
base64 = "0.22.1"
bytes = "1.11.1"
chrono = "0.4.45"
serde = "1.0.228"
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = "1.52.3"
url = "2.5.8"
uuid = "1.23.2"
