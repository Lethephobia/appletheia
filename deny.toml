# Run with cargo-deny 0.20.2:
# cargo deny --all-features check advisories licenses sources

[advisories]
# Fail on withdrawn releases as well as known vulnerabilities.
yanked = "deny"
# Only the explicitly documented advisories below are exempted; others still fail.
ignore = [
    # Anchor/Solana require bincode internally. Banking's own transaction
    # serialization already uses wincode. Remove when upstream migrates.
    "RUSTSEC-2025-0141",
    # Alloy primitives and Solidity macros require paste unconditionally.
    # Remove when upstream replaces it; Appletheia does not depend on it directly.
    "RUSTSEC-2024-0436",
    # Temporary acceptance for Alloy used by the Banking example (including signing).
    # Alloy 2.5.0 still requires crypto-bigint 0.5 via elliptic-curve/k256.
    # This does not establish safety; remove once upstream uses patched versions.
    # Track removal: https://github.com/Lethephobia/appletheia/issues/164
    # Upstream: https://github.com/alloy-rs/alloy/issues/4445
    "RUSTSEC-2026-0387",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Zlib",
]
# The same policy is shared by three workspaces with different dependency graphs.
unused-allowed-license = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
