[package]
name = "banking-ledger-application"
version = "0.1.0"
edition = "2024"

[dependencies]
appletheia = { workspace = true, features = ["application", "macros-application"] }
banking-iam-application = { workspace = true }
banking-iam-domain = { workspace = true }
banking-ledger-domain = { workspace = true }
banking-shared-kernel-application = { workspace = true }
banking-shared-kernel-domain = { workspace = true }
base64 = "0.22.1"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
serde_json = "1.0.150"
tokio = { workspace = true, features = ["macros", "rt"] }
