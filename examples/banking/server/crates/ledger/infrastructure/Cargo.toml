[package]
name = "banking-ledger-infrastructure"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = "2.4.2"
anchor-lang = "1.2.0"
appletheia = { workspace = true, features = ["application", "infrastructure"] }
banking-settlement = { path = "../../../../onchain/solana/programs/banking-settlement", features = ["no-entrypoint"] }
banking-iam-domain = { workspace = true }
banking-ledger-application = { workspace = true }
banking-ledger-domain = { workspace = true }
chrono = { workspace = true }
solana-client = "4.2.2"
solana-commitment-config = "3.1.1"
solana-sdk = "4.0.1"
solana-system-interface = "3.2.0"
solana-transaction = { version = "4.1.5", features = ["wincode"] }
spl-associated-token-account-interface = "2.0.0"
spl-token-2022-interface = "3.1.1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
thiserror = { workspace = true }
uuid = { workspace = true }
wincode = "0.5.5"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
