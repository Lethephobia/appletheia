[package]
name = "banking-ledger-infrastructure"
version = "0.1.0"
edition = "2024"

[dependencies]
appletheia = { workspace = true, features = ["infrastructure"] }
banking-iam-domain = { workspace = true }
banking-ledger-application = { workspace = true }
banking-ledger-domain = { workspace = true }
# `solana-client` 4.0.0-rc.0 still exposes the 3.x transaction type in its RPC
# API, so keep the direct `solana-transaction` dependency aligned with that
# client surface when upgrading these crates together.
solana-client = "4.0.0-rc.0"
solana-sdk = "4.0.1"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
solana-transaction = { version = "3.1.0", features = ["bincode"] }
spl-associated-token-account-interface = "2.0.0"
spl-token-2022-interface = "3.0.0"
spl-token-metadata-interface = "1.0.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
thiserror = "2.0.17"
uuid = { version = "1" }
