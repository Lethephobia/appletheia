[workspace]
resolver = "3"

members = [
    "crates/*/*",
    "servers/*",
]

[workspace.dependencies]
appletheia = { path = "../../../crates/appletheia" }
banking-shared-kernel-domain = { path = "crates/shared-kernel/domain" }
banking-shared-kernel-application = { path = "crates/shared-kernel/application" }
banking-shared-kernel-infrastructure = { path = "crates/shared-kernel/infrastructure" }
banking-iam-domain = { path = "crates/iam/domain" }
banking-iam-application = { path = "crates/iam/application" }
banking-iam-infrastructure = { path = "crates/iam/infrastructure" }
banking-ledger-domain = { path = "crates/ledger/domain" }
banking-ledger-application = { path = "crates/ledger/application" }
banking-ledger-infrastructure = { path = "crates/ledger/infrastructure" }
chrono = { version = "0.4.45" }
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = "0.9.0"
thiserror = "2.0.20"
tokio = "1.53.1"
url = "2.5.8"
uuid = "1.26.0"
