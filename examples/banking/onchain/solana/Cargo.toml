[workspace]
members = [
    "programs/*"
]
resolver = "2"

[workspace.package]
license = "MIT"

[workspace.dependencies]
anchor-lang = { version = "1.2.1", default-features = false, features = ["solana-v4"] }
anchor-spl = { version = "1.2.1", default-features = false, features = ["solana-v4"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
